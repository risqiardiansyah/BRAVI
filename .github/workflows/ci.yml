name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry install
      - run: poetry run black --check .
      - run: poetry run ruff check .

  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry install
      - run: poetry run mypy app

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry install
      - run: poetry run pytest

  dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry install
      - run: poetry run pip install --quiet pip-audit
      - run: poetry run pip-audit

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bravi-ai-chatbot:${{ github.sha }} ./backend
