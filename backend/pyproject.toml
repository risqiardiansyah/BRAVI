[tool.poetry]
name = "bravi-ai-chatbot"
version = "0.1.0"
description = "AI Agent Orchestration backend for a document-grounded chatbot (User/Operator personas), built on FastAPI, LangGraph, PostgreSQL+pgvector, and AWS Bedrock."
authors = ["BRAVI Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.140"
# Pinned explicitly (not just a transitive fastapi dependency) to force resolution past
# 0.46.2, which carries several known CVEs (docs/08-security.md §8, Phase 12) that
# fastapi's own `>=0.46.0` constraint alone would not have picked up.
starlette = "^1.3.1"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic-settings = "^2.6"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.13"
pgvector = "^0.3"
boto3 = "^1.35"
redis = "^5.0"
prometheus-client = "^0.21"
langgraph = "^1.2.9"
pypdf = "^6.14.2"
tiktoken = "^0.13.0"
httpx = "^0.28.1"
apscheduler = "^3.11.3"
python-multipart = "^0.0.32"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
black = "^26.3"
ruff = "^0.7"
mypy = "^1.13"
pytest = "^9.0"
pytest-asyncio = "^1.4"
fakeredis = "^2.24"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "load: sustained concurrent-load test against a real DB (docs/12-testing-strategy.md §1/§6) — excluded by default, run via `pytest -m load`",
]
addopts = ["-m", "not load"]
